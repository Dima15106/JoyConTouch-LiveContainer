name: Build JoyConTouch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"

          mkdir -p build

          "$CLANG" \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -arch arm64 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework GameController \
            -install_name "@rpath/JoyConTouch.dylib" \
            JoyConTouch.m \
            -o build/JoyConTouch.dylib

      - name: Package
        run: |
          cd build
          zip -9 JoyConTouch-LiveContainer.zip JoyConTouch.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyConTouch-LiveContainer
          path: build/JoyConTouch-LiveContainer.zip
